{% extends 'base.html' %}
{% block title %}
    {{ item.name }}
{% endblock %}
{% block content %}
    <div class="row g-4">
        <div class="col-md-6">
            {% if item.image %}
                <img class="img-fluid rounded-4" src="{{ item.image.url }}" alt="{{ item.name }}">
            {% else %}
                <div class="food-placeholder detail-placeholder">
                    🍽️
                </div>
            {% endif %}
        </div>
        <div class="col-md-6">
            <small class="text-muted">{{ item.category.name }}</small>
            <h1>
                {{ item.name }}
            </h1>
            <p>
                {{ item.description }}
            </p>
            <h3>
                ₹{{ item.price }}
            </h3>
            <form method="post" action="{% url 'food:cart_add' item.pk %}" class="d-flex gap-2">
                {% csrf_token %}
                <input class="form-control" type="number" name="quantity" value="1" min="1" max="99" style="max-width:100px">
                <button class="btn btn-warning">Add to cart</button>
            </form>
        </div>
    </div>
{% endblock %}
